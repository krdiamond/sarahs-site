<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>…</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0a0a0a;
        color: #c8c8c8;
        font-family: "Times New Roman", Times, serif;
      }

      main {
        max-width: 28rem;
        text-align: center;
      }

      p {
        margin: 0;
        font-size: clamp(1.25rem, 3vw, 1.75rem);
        letter-spacing: 0.02em;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <p>There’s nothing here.</p>
    </main>
  </body>
</html>
