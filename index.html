<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sarah Fensom — Film &amp; Arts Journalist</title>
    <meta
      name="description"
      content="Sarah Fensom is a film and arts journalist based in Los Angeles. With over 15 years of experience as a writer, she has contributed to the Los Angeles Times, American Cinematographer, BOMB, Sight and Sound, LA Review of Books, Film Comment, and a host of other publications. She is the co-writer and star of Lindsay Denniberg’s forthcoming film, Killer Makeover and a uniquely glamorous person."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sarah Fensom" />
    <meta property="og:title" content="Sarah Fensom — Film &amp; Arts Journalist" />
    <meta
      property="og:description"
      content="Sarah Fensom is a film and arts journalist based in Los Angeles. With over 15 years of experience as a writer, she has contributed to the Los Angeles Times, American Cinematographer, BOMB, Sight and Sound, LA Review of Books, Film Comment, and a host of other publications. She is the co-writer and star of Lindsay Denniberg’s forthcoming film, Killer Makeover and a uniquely glamorous person."
    />
    <meta
      property="og:url"
      content="https://krdiamond.github.io/sarahs-site/"
    />
    <meta
      property="og:image"
      content="https://krdiamond.github.io/sarahs-site/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sarah Fensom — Film &amp; Arts Journalist" />
    <meta
      name="twitter:description"
      content="Sarah Fensom is a film and arts journalist based in Los Angeles. With over 15 years of experience as a writer, she has contributed to the Los Angeles Times, American Cinematographer, BOMB, Sight and Sound, LA Review of Books, Film Comment, and a host of other publications. She is the co-writer and star of Lindsay Denniberg’s forthcoming film, Killer Makeover and a uniquely glamorous person."
    />
    <meta
      name="twitter:image"
      content="https://krdiamond.github.io/sarahs-site/og-image.png"
    />
  </head>
  <body>
    <!-- Screen-reader-only bypass; intentionally never shown visually -->
    <a href="#main-content" class="sr-only">Skip to content</a>
    <main
      id="main-content"
      class="flex h-dvh w-full overflow-hidden font-['Times_New_Roman',Times,serif] text-[12px] leading-normal max-[450px]:flex-col"
    >
      <!-- Gray lists. ≤450px: under white stage (order-2), fills remaining height and scrolls. -->
      <div
        class="flex h-full min-h-0 w-1/2 flex-col bg-neutral-200 max-[450px]:order-2 max-[450px]:h-auto max-[450px]:min-h-0 max-[450px]:w-full max-[450px]:flex-1"
      >
        <section
          class="flex min-h-0 flex-[1_1_0%] flex-col overflow-hidden border-b border-black p-4"
          aria-labelledby="contact-heading"
        >
          <h2
            id="contact-heading"
            class="mb-3 shrink-0 font-bold max-[450px]:mb-[3px]"
          >
            Contact
          </h2>
          <div id="contact-body" class="min-h-0 flex-1 overflow-y-auto overscroll-contain"></div>
        </section>
        <section
          class="flex min-h-0 flex-[1_1_0%] flex-col overflow-hidden border-b border-black p-4"
        >
          <h2 class="mb-3 shrink-0 font-bold max-[450px]:mb-[3px]">Events</h2>
          <div id="events-body" class="min-h-0 flex-1 overflow-hidden"></div>
        </section>
        <section
          class="flex min-h-0 flex-[2_1_0%] flex-col overflow-hidden p-4"
        >
          <h2 class="mb-3 shrink-0 font-bold max-[450px]:mb-[3px]">Work</h2>
          <div id="work-body" class="min-h-0 flex-1 overflow-hidden"></div>
        </section>
      </div>

      <!-- White stage. ≤450px: on top (order-1), exactly 100px, full-bleed H1↔icon marquee (no drag). -->
      <div
        class="relative h-full w-1/2 overflow-hidden bg-white p-4 max-[450px]:order-1 max-[450px]:h-[100px] max-[450px]:w-full max-[450px]:shrink-0 max-[450px]:p-0"
      >
        <!-- Desktop / tablet: draggable icons + corner H1 (chrome paints immediately) -->
        <div
          id="stage"
          class="relative h-full w-full overflow-hidden max-[450px]:hidden"
        >
          <div
            id="stage-loading"
            class="stage-loading pointer-events-none absolute inset-0 z-10 flex items-center justify-center"
            aria-hidden="true"
          >
            <span class="stage-loading__dot"></span>
          </div>
          <h1
            class="absolute right-0 bottom-0 z-50 m-0 text-right font-['Times_New_Roman',Times,serif] text-[48px] leading-none"
          >
            Sarah Fensom
          </h1>
        </div>

        <!-- ≤450px: SR title + imperative HTML/CSS marquee host -->
        <div class="hidden h-full w-full max-[450px]:flex max-[450px]:flex-col">
          <h1 class="sr-only">Sarah Fensom</h1>
          <div
            id="marquee-host"
            class="marquee-viewport flex min-h-0 flex-1 items-center overflow-hidden"
            aria-hidden="true"
          ></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
